name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Linux test CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fd-find ripgrep
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd

      - name: Build & smoke-test native Rust Linux Hands binary
        run: |
          cargo test --offline --manifest-path hands/linux-hands-native/Cargo.toml
          cargo build --release --offline --manifest-path hands/linux-hands-native/Cargo.toml
          ./hands/linux-hands-native/target/release/linux-hands ping
          ./hands/linux-hands-native/target/release/linux-hands version
          mkdir -p hands/linux-hands-native/bin
          cp hands/linux-hands-native/target/release/linux-hands hands/linux-hands-native/bin/linux-hands

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run eval -- --fuzz
      - run: npm run eval -- --audit
      - run: npm run prompt-size -- --ci
      - run: npm run route-check -- --words-only
      - run: npm run package:dry

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run eval -- --fuzz
      - run: npm run eval -- --audit
      - run: npm run prompt-size -- --ci
      - run: npm run route-check -- --words-only
      - run: npm run package:dry
      - name: Run Windows & cross-platform Vitest suites
        run: >
          npx vitest run
          tests/platformAdapter.test.ts
          tests/semanticBridge.test.ts
          tests/bootstrap.test.ts
          tests/editionSplit.test.ts
          tests/onboardingSettings.test.ts
          tests/customModel.test.ts
          tests/persona.test.ts
          tests/fuzz.test.ts
          tests/evalWorld.test.ts
          tests/dryRun.test.ts
          tests/permissions.test.ts
          tests/vrmAndAnimation.test.ts
          tests/mcpAndWorkshop.test.ts
          tests/macosMlxIos.test.ts
          tests/spatialStagePresence.test.ts
          tests/multimodalStreaming.test.ts
          tests/grammarLoopAndCatalog.test.ts
          tests/securityBoundariesAudit.test.ts

  win-hands-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build NativeAOT Windows Hands helper
        run: >
          dotnet publish hands/win-hands-native/WinHands.csproj
          -c Release -r win-x64 -p:PublishAot=true --self-contained
          -o dist/win-hands-native

      - name: Smoke test win-hands.exe
        shell: pwsh
        run: |
          ./dist/win-hands-native/win-hands.exe ping
          ./dist/win-hands-native/win-hands.exe version
          '{}' | ./dist/win-hands-native/win-hands.exe volume-get
          '{"id":"1","verb":"ping"}' | ./dist/win-hands-native/win-hands.exe --serve | Select-String '"ok":true'

      - uses: actions/upload-artifact@v4
        with:
          name: win-hands-native-win-x64
          path: dist/win-hands-native/win-hands.exe

  verify-model-sizes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:model-sizes
