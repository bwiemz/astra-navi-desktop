name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      edition:
        description: "Release edition (community or supporter)"
        required: true
        default: "community"
        type: choice
        options:
          - community
          - supporter
      signing_mode:
        description: "Windows signing profile mode (auto, public, private, dry-run-self-signed)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - public
          - private
          - dry-run-self-signed
      require_windows_signing:
        description: "Fail build if Windows Authenticode signing secrets are absent"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  win-hands-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build NativeAOT Windows Hands helper
        run: >
          dotnet publish hands/win-hands-native/WinHands.csproj
          -c Release -r win-x64 -p:PublishAot=true --self-contained
          -o hands/win-hands-native/bin/Release/net9.0/win-x64/publish

      - name: Smoke test win-hands.exe
        shell: pwsh
        run: |
          ./hands/win-hands-native/bin/Release/net9.0/win-x64/publish/win-hands.exe ping
          ./hands/win-hands-native/bin/Release/net9.0/win-x64/publish/win-hands.exe version
          '{}' | ./hands/win-hands-native/bin/Release/net9.0/win-x64/publish/win-hands.exe volume-get
          '{"id":"1","verb":"ping"}' | ./hands/win-hands-native/bin/Release/net9.0/win-x64/publish/win-hands.exe --serve | Select-String '"ok":true'

      - name: Detect Windows signing configuration
        id: signing_env
        shell: pwsh
        env:
          SIGNING_MODE_INPUT: ${{ inputs.signing_mode || 'auto' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE }}
          AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ASTRA_NAVI_CERT_PFX_B64: ${{ secrets.ASTRA_NAVI_CERT_PFX_B64 }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_SLUG: ${{ secrets.SIGNPATH_ORG_SLUG }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          $modeInput = if ([string]::IsNullOrWhiteSpace($env:SIGNING_MODE_INPUT)) { "auto" } else { $env:SIGNING_MODE_INPUT }
          $profileMode = if ($modeInput -in @("public", "private")) { $modeInput } else { "auto" }

          $hasOidc = (-not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) -and
                     (-not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) -and
                     (-not [string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID))

          $azBase = (-not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ENDPOINT)) -and
                    (-not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ACCOUNT))
          $azPublic = -not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_CERT_PROFILE)
          $azPrivate = -not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE)
          $hasAzureProfile = switch ($profileMode) {
            "public" { $azPublic }
            "private" { $azPrivate -or $azPublic }
            default { $azPublic -or $azPrivate }
          }
          $hasAzure = $azBase -and $hasAzureProfile
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:ASTRA_NAVI_CERT_PFX_B64)
          $hasSignPath = (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) -and
                         (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG_SLUG)) -and
                         (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG))

          $effective = "unsigned"
          if ($modeInput -eq "dry-run-self-signed") {
            $effective = "self-signed-test"
          } elseif ($hasAzure) {
            $effective = "azure"
          } elseif ($hasSignPath) {
            $effective = "signpath"
          } elseif ($hasPfx) {
            $effective = "pfx"
          }

          $useAzureOidc = if ($effective -eq "azure" -and $hasOidc) { "true" } else { "false" }
          "effective_mode=$effective" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "profile_mode=$profileMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "use_azure_oidc=$useAzureOidc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "win-hands signing resolved: input=$modeInput -> effective_mode=$effective, profile_mode=$profileMode, use_azure_oidc=$useAzureOidc"

      - name: Azure Login (OIDC)
        if: steps.signing_env.outputs.use_azure_oidc == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Trusted Signing Client (Dlib)
        if: steps.signing_env.outputs.effective_mode == 'azure'
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:RUNNER_TEMP "trusted-signing"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if (-not $nuget) {
            $nugetExe = Join-Path $env:RUNNER_TEMP "nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetExe
            & $nugetExe install Microsoft.Trusted.Signing.Client -OutputDirectory $pkgDir -NonInteractive
          } else {
            & $nuget.Source install Microsoft.Trusted.Signing.Client -OutputDirectory $pkgDir -NonInteractive
          }

      - name: Sign & verify win-hands.exe (when credentials configured)
        shell: pwsh
        env:
          EFFECTIVE_PROVIDER: ${{ steps.signing_env.outputs.effective_mode }}
          PROFILE_MODE: ${{ steps.signing_env.outputs.profile_mode }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE }}
          AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE }}
          AZURE_PRIVATE_TRUST_ROOT_CER_B64: ${{ secrets.AZURE_PRIVATE_TRUST_ROOT_CER_B64 }}
          ASTRA_NAVI_CERT_PFX_B64: ${{ secrets.ASTRA_NAVI_CERT_PFX_B64 }}
          ASTRA_NAVI_CERT_PASS: ${{ secrets.ASTRA_NAVI_CERT_PASS }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_SLUG: ${{ secrets.SIGNPATH_ORG_SLUG }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          $helper = @("hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe")
          if ($env:EFFECTIVE_PROVIDER -eq "self-signed-test") {
            Write-Host "Dry-run self-signed mode: deferring win-hands.exe test signature to package-windows so the runner root certificate matches."
            & .\scripts\sign-windows.ps1 -DryRun -Targets $helper
          } elseif ($env:EFFECTIVE_PROVIDER -in @("azure", "pfx", "signpath")) {
            if ($env:EFFECTIVE_PROVIDER -eq "pfx") {
              $pfxOut = Join-Path $env:RUNNER_TEMP "release-cert.pfx"
              [IO.File]::WriteAllBytes($pfxOut, [Convert]::FromBase64String(($env:ASTRA_NAVI_CERT_PFX_B64 -replace '\s+', '')))
              $env:ASTRA_NAVI_CERT_PFX = $pfxOut
            }
            & .\scripts\sign-windows.ps1 -Provider $env:EFFECTIVE_PROVIDER -ProfileMode $env:PROFILE_MODE -Targets $helper
            if ($env:EFFECTIVE_PROVIDER -ne "signpath") {
              & .\scripts\sign-windows.ps1 -VerifyOnly -Targets $helper
            }
          } elseif ($env:REQUIRE_SIGNING -eq "true") {
            throw "Windows signing secrets are missing and require_windows_signing=true."
          } else {
            Write-Host "No Windows signing credentials configured; skipping Authenticode signature on win-hands.exe."
            & .\scripts\sign-windows.ps1 -DryRun -Targets $helper
          }

      - uses: actions/upload-artifact@v4
        with:
          name: win-hands-native-win-x64
          path: hands/win-hands-native/bin/Release/net9.0/win-x64/publish/win-hands.exe

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run package:extension
      - uses: actions/upload-artifact@v4
        with:
          name: browser-bridge-store-zips
          path: |
            dist/astra-navi-browser-bridge-chromium-*.zip
            dist/astra-navi-browser-bridge-firefox-*.zip
            dist/browser-bridge-checksums.txt

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release APK when Android release keystore is configured
        env:
          ANDROID_RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          ASTRA_NAVI_ANDROID_RELEASE_PASS: ${{ secrets.ASTRA_NAVI_ANDROID_RELEASE_PASS }}
          ASTRA_NAVI_ANDROID_RELEASE_ALIAS: ${{ secrets.ASTRA_NAVI_ANDROID_RELEASE_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_RELEASE_KEYSTORE_B64}" || -z "${ASTRA_NAVI_ANDROID_RELEASE_PASS}" ]]; then
            echo "Android release secrets not set; skipping APK build for this run."
            mkdir -p phone-app/build
            echo "skipped" > phone-app/build/SKIPPED.txt
            exit 0
          fi
          key_path="${RUNNER_TEMP}/astranavi-android-release.p12"
          pass_path="${RUNNER_TEMP}/astranavi-android-release.pass"
          trap 'rm -f "${key_path:-}" "${pass_path:-}"' EXIT

          clean_b64="$(printf '%s' "${ANDROID_RELEASE_KEYSTORE_B64}" | tr -d '[:space:]')"
          if ! printf '%s' "${clean_b64}" | base64 --decode > "${key_path}"; then
            echo "::error::ANDROID_RELEASE_KEYSTORE_B64 is not valid base64 (make sure you pasted single-line base64 output of android-release.p12)."
            exit 2
          fi
          key_bytes="$(wc -c < "${key_path}")"
          chmod 600 "${key_path}"

          printf '%s' "${ASTRA_NAVI_ANDROID_RELEASE_PASS}" | tr -d '\r\n' > "${pass_path}"
          chmod 600 "${pass_path}"
          clean_alias="$(printf '%s' "${ASTRA_NAVI_ANDROID_RELEASE_ALIAS:-astranavi-release}" | tr -d '[:space:]')"
          clean_alias="${clean_alias:-astranavi-release}"

          bash scripts/setup-android.sh

          keytool_bin="${HOME}/.local/share/ai-chan-android/jdk/bin/keytool"
          if [[ ! -x "${keytool_bin}" ]]; then
            keytool_bin="keytool"
          fi
          if ! keystore_info="$("${keytool_bin}" -list -v -keystore "${key_path}" -storetype PKCS12 -storepass:file "${pass_path}" 2>&1)"; then
            echo "::error::Could not unlock decoded PKCS12 keystore (${key_bytes} bytes). Check that ANDROID_RELEASE_KEYSTORE_B64 and ASTRA_NAVI_ANDROID_RELEASE_PASS match the same keystore."
            echo "Keytool summary: $(printf '%s\n' "${keystore_info}" | head -n 3)"
            exit 2
          fi
          printf '%s\n' "${keystore_info}" | grep -E "Alias name:|SHA256:" || true
          if ! "${keytool_bin}" -list -keystore "${key_path}" -storetype PKCS12 -storepass:file "${pass_path}" -alias "${clean_alias}" >/dev/null 2>&1; then
            echo "::error::Keystore unlocked (${key_bytes} bytes), but alias '${clean_alias}' was not found. Check ASTRA_NAVI_ANDROID_RELEASE_ALIAS (default is 'astranavi-release')."
            exit 2
          fi

          ASTRA_NAVI_ANDROID_RELEASE_KEYSTORE="${key_path}" \
          ASTRA_NAVI_ANDROID_RELEASE_PASS_FILE="${pass_path}" \
          ASTRA_NAVI_ANDROID_RELEASE_ALIAS="${clean_alias}" \
            bash scripts/build-android.sh --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: phone-app/build/

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fd-find ripgrep rpm
          sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd
      - name: Build native Rust Linux Hands helper
        run: |
          cargo build --release --offline --manifest-path hands/linux-hands-native/Cargo.toml
          ./hands/linux-hands-native/target/release/linux-hands ping
          ./hands/linux-hands-native/target/release/linux-hands version
          mkdir -p hands/linux-hands-native/bin
          cp hands/linux-hands-native/target/release/linux-hands hands/linux-hands-native/bin/linux-hands
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run eval -- --fuzz
      - run: npm run eval -- --audit
      - name: Verify Supporter overlay secret when building Supporter Edition
        if: ${{ inputs.edition == 'supporter' }}
        env:
          SUPPORTER_OVERLAY_TOKEN: ${{ secrets.SUPPORTER_OVERLAY_TOKEN }}
        run: |
          if [[ -z "${SUPPORTER_OVERLAY_TOKEN}" ]]; then
            echo "::error::SUPPORTER_OVERLAY_TOKEN secret is required for edition=supporter to check out bwiemz/astra-navi-supporter."
            exit 1
          fi
      - name: Checkout private Supporter overlay
        if: ${{ inputs.edition == 'supporter' }}
        uses: actions/checkout@v4
        with:
          repository: bwiemz/astra-navi-supporter
          path: _supporter
          token: ${{ secrets.SUPPORTER_OVERLAY_TOKEN }}
          persist-credentials: false
      - name: Apply Supporter overlay & clean staging directory
        if: ${{ inputs.edition == 'supporter' }}
        run: |
          cp -a _supporter/overlay/. .
          rm -rf _supporter
      - name: Package Linux AppImage & .deb
        env:
          ASTRA_NAVI_EDITION: ${{ inputs.edition || 'community' }}
        run: node scripts/package-release.ts --edition "${ASTRA_NAVI_EDITION}" --platform linux --checksums
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/edition-manifest.json
            dist/SHA256SUMS.txt

  package-windows:
    runs-on: windows-latest
    needs: [win-hands-native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: win-hands-native-win-x64
          path: hands/win-hands-native/bin/Release/net9.0/win-x64/publish
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run eval -- --fuzz
      - run: npm run eval -- --audit
      - name: Verify Supporter overlay secret when building Supporter Edition
        if: ${{ inputs.edition == 'supporter' }}
        shell: pwsh
        env:
          SUPPORTER_OVERLAY_TOKEN: ${{ secrets.SUPPORTER_OVERLAY_TOKEN }}
        run: |
          if (-not $env:SUPPORTER_OVERLAY_TOKEN) {
            throw "SUPPORTER_OVERLAY_TOKEN secret is required for edition=supporter to check out bwiemz/astra-navi-supporter."
          }
      - name: Checkout private Supporter overlay
        if: ${{ inputs.edition == 'supporter' }}
        uses: actions/checkout@v4
        with:
          repository: bwiemz/astra-navi-supporter
          path: _supporter
          token: ${{ secrets.SUPPORTER_OVERLAY_TOKEN }}
          persist-credentials: false
      - name: Apply Supporter overlay & clean staging directory
        if: ${{ inputs.edition == 'supporter' }}
        shell: pwsh
        run: |
          Copy-Item -Path "_supporter/overlay/*" -Destination "." -Recurse -Force
          Remove-Item -Path "_supporter" -Recurse -Force

      - name: Detect Windows signing configuration
        id: signing_env
        shell: pwsh
        env:
          SIGNING_MODE_INPUT: ${{ inputs.signing_mode || 'auto' }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE }}
          AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ASTRA_NAVI_CERT_PFX_B64: ${{ secrets.ASTRA_NAVI_CERT_PFX_B64 }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_SLUG: ${{ secrets.SIGNPATH_ORG_SLUG }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          $modeInput = if ([string]::IsNullOrWhiteSpace($env:SIGNING_MODE_INPUT)) { "auto" } else { $env:SIGNING_MODE_INPUT }
          $profileMode = if ($modeInput -in @("public", "private")) { $modeInput } else { "auto" }

          $hasOidc = (-not [string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) -and
                     (-not [string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) -and
                     (-not [string]::IsNullOrWhiteSpace($env:AZURE_SUBSCRIPTION_ID))

          $azBase = (-not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ENDPOINT)) -and
                    (-not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_ACCOUNT))
          $azPublic = -not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_CERT_PROFILE)
          $azPrivate = -not [string]::IsNullOrWhiteSpace($env:AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE)
          $hasAzureProfile = switch ($profileMode) {
            "public" { $azPublic }
            "private" { $azPrivate -or $azPublic }
            default { $azPublic -or $azPrivate }
          }
          $hasAzure = $azBase -and $hasAzureProfile
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:ASTRA_NAVI_CERT_PFX_B64)
          $hasSignPath = (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) -and
                         (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORG_SLUG)) -and
                         (-not [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG))

          $effective = "unsigned"
          if ($modeInput -eq "dry-run-self-signed") {
            $effective = "self-signed-test"
          } elseif ($hasAzure) {
            $effective = "azure"
          } elseif ($hasSignPath) {
            $effective = "signpath"
          } elseif ($hasPfx) {
            $effective = "pfx"
          }

          $useAzureOidc = if ($effective -eq "azure" -and $hasOidc) { "true" } else { "false" }
          "effective_mode=$effective" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "profile_mode=$profileMode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "use_azure_oidc=$useAzureOidc" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "package-windows signing resolved: input=$modeInput -> effective_mode=$effective, profile_mode=$profileMode, use_azure_oidc=$useAzureOidc"

      - name: Azure Login (OIDC)
        if: steps.signing_env.outputs.use_azure_oidc == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Trusted Signing Client (Dlib)
        if: steps.signing_env.outputs.effective_mode == 'azure'
        shell: pwsh
        run: |
          $pkgDir = Join-Path $env:RUNNER_TEMP "trusted-signing"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if (-not $nuget) {
            $nugetExe = Join-Path $env:RUNNER_TEMP "nuget.exe"
            Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetExe
            & $nugetExe install Microsoft.Trusted.Signing.Client -OutputDirectory $pkgDir -NonInteractive
          } else {
            & $nuget.Source install Microsoft.Trusted.Signing.Client -OutputDirectory $pkgDir -NonInteractive
          }

      - name: Stage 1 - Package Windows unpacked app directory
        shell: pwsh
        env:
          ASTRA_NAVI_EDITION: ${{ inputs.edition || 'community' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package-release.ts --edition $env:ASTRA_NAVI_EDITION --platform win --stage unpacked

      - name: Verify packaged win-hands.exe exists inside Stage 1 unpacked resources
        shell: pwsh
        run: |
          $packagedWinHands = "dist\win-unpacked\resources\hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe"
          if (-not (Test-Path $packagedWinHands)) {
            throw "Packaged Stage 1 directory is missing required native helper: $packagedWinHands"
          }
          Write-Host "Packaged win-hands.exe confirmed: $packagedWinHands ($((Get-Item $packagedWinHands).Length) bytes)"

      - name: Sign Stage 1 Windows executables (before installer bundling)
        if: steps.signing_env.outputs.effective_mode != 'unsigned' && steps.signing_env.outputs.effective_mode != 'signpath'
        shell: pwsh
        env:
          EFFECTIVE_PROVIDER: ${{ steps.signing_env.outputs.effective_mode }}
          PROFILE_MODE: ${{ steps.signing_env.outputs.profile_mode }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE }}
          AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE }}
          AZURE_PRIVATE_TRUST_ROOT_CER_B64: ${{ secrets.AZURE_PRIVATE_TRUST_ROOT_CER_B64 }}
          ASTRA_NAVI_CERT_PFX_B64: ${{ secrets.ASTRA_NAVI_CERT_PFX_B64 }}
          ASTRA_NAVI_CERT_PASS: ${{ secrets.ASTRA_NAVI_CERT_PASS }}
        run: |
          if ($env:EFFECTIVE_PROVIDER -eq "pfx") {
            $pfxOut = Join-Path $env:RUNNER_TEMP "release-cert.pfx"
            [IO.File]::WriteAllBytes($pfxOut, [Convert]::FromBase64String(($env:ASTRA_NAVI_CERT_PFX_B64 -replace '\s+', '')))
            $env:ASTRA_NAVI_CERT_PFX = $pfxOut
          }
          $stage1Targets = @(
            "hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe",
            "dist\win-unpacked\resources\hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe",
            "dist\win-unpacked\Astra Navi Desktop.exe"
          )
          & .\scripts\sign-windows.ps1 -Provider $env:EFFECTIVE_PROVIDER -ProfileMode $env:PROFILE_MODE -RequireAllTargets -Targets $stage1Targets

      - name: Stage 2 - Package Windows NSIS & Portable installers from prepackaged dir
        shell: pwsh
        env:
          ASTRA_NAVI_EDITION: ${{ inputs.edition || 'community' }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package-release.ts --edition $env:ASTRA_NAVI_EDITION --platform win --stage installers

      - name: Sign Stage 2 Windows installers (or enforce require_windows_signing)
        shell: pwsh
        env:
          EFFECTIVE_PROVIDER: ${{ steps.signing_env.outputs.effective_mode }}
          PROFILE_MODE: ${{ steps.signing_env.outputs.profile_mode }}
          REQUIRE_SIGNING: ${{ inputs.require_windows_signing }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE }}
          AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE: ${{ secrets.AZURE_CODE_SIGNING_CERT_PROFILE_PRIVATE }}
          AZURE_PRIVATE_TRUST_ROOT_CER_B64: ${{ secrets.AZURE_PRIVATE_TRUST_ROOT_CER_B64 }}
          ASTRA_NAVI_CERT_PFX_B64: ${{ secrets.ASTRA_NAVI_CERT_PFX_B64 }}
          ASTRA_NAVI_CERT_PASS: ${{ secrets.ASTRA_NAVI_CERT_PASS }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_SLUG: ${{ secrets.SIGNPATH_ORG_SLUG }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          if ($env:EFFECTIVE_PROVIDER -eq "unsigned") {
            if ($env:REQUIRE_SIGNING -eq "true") {
              throw "Windows signing secrets are missing and require_windows_signing=true."
            }
            Write-Host "No Windows signing secrets set; writing unsigned draft artifacts."
            & .\scripts\sign-windows.ps1 -DryRun
            exit 0
          }
          if ($env:EFFECTIVE_PROVIDER -eq "pfx") {
            $pfxOut = Join-Path $env:RUNNER_TEMP "release-cert.pfx"
            [IO.File]::WriteAllBytes($pfxOut, [Convert]::FromBase64String(($env:ASTRA_NAVI_CERT_PFX_B64 -replace '\s+', '')))
            $env:ASTRA_NAVI_CERT_PFX = $pfxOut
          }
          if ($env:EFFECTIVE_PROVIDER -eq "signpath") {
            & .\scripts\sign-windows.ps1 -Provider signpath
            exit 0
          }
          $stage2Targets = @(
            "dist\Astra Navi Desktop Setup*.exe",
            "dist\Astra Navi Desktop*.exe"
          )
          & .\scripts\sign-windows.ps1 -Provider $env:EFFECTIVE_PROVIDER -ProfileMode $env:PROFILE_MODE -RequireAllTargets -Targets $stage2Targets

      - name: Verify Authenticode signatures, RFC 3161 timestamps, and untouched third-party DLLs
        if: steps.signing_env.outputs.effective_mode != 'unsigned' && steps.signing_env.outputs.effective_mode != 'signpath'
        shell: pwsh
        env:
          AZURE_PRIVATE_TRUST_ROOT_CER_B64: ${{ secrets.AZURE_PRIVATE_TRUST_ROOT_CER_B64 }}
        run: |
          $allTargets = @(
            "hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe",
            "dist\win-unpacked\resources\hands\win-hands-native\bin\Release\net9.0\win-x64\publish\win-hands.exe",
            "dist\win-unpacked\Astra Navi Desktop.exe",
            "dist\Astra Navi Desktop Setup*.exe",
            "dist\Astra Navi Desktop*.exe"
          )
          & .\scripts\sign-windows.ps1 -VerifyOnly -RequireAllTargets -Targets $allTargets -AssertNoThirdPartyResignDir "dist\win-unpacked"

      - name: Compute Windows SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $($_.Name)"
          } | Set-Content -Path dist\SHA256SUMS-windows.txt -Encoding UTF8

      - name: Upload dry-run self-signed Windows artifacts
        if: steps.signing_env.outputs.effective_mode == 'self-signed-test'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-signing-dry-run
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt

      - name: Upload Windows installers
        if: steps.signing_env.outputs.effective_mode != 'self-signed-test'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt

  draft-github-release:
    runs-on: ubuntu-latest
    needs: [browser-extension, android-apk, package-linux, package-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Consolidate artifacts & compute unified SHA256SUMS.txt
        run: |
          mkdir -p upload
          find release-artifacts -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.blockmap' -o -name '*.zip' -o -name '*.apk' -o -name 'edition-manifest.json' \) -exec cp -v {} upload/ \;
          (cd upload && sha256sum * > SHA256SUMS.txt)
      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" upload/* \
            --draft \
            --verify-tag \
            --title "Astra Navi Desktop ${TAG}" \
            --notes-file CHANGELOG.md
