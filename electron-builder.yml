appId: app.astranavi.desktop
productName: Astra Navi Desktop
copyright: Copyright © 2026 Astra Navi Contributors (MIT)
npmRebuild: false
directories:
  output: dist
  buildResources: assets
asar: true
asarUnpack:
  - "**/*.node"
  - "**/*.wasm"
  - "**/*.so"
  - "**/*.so.*"
  - "**/*.dll"
  - "**/*.dylib"
  - "node_modules/@img/**"
files:
  - out/**/*
  - package.json
  - "!node_modules/**/*.map"
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
      - "!**/*.blend"
      - "!**/*.blend1"
      - "!**/*.xcf"
      - "!**/*.psd"
  - from: hands
    to: hands
    filter:
      - "**/*"
      - "!win_hands.ps1"
      - "!win-hands-native/obj/**"
      - "!win-hands-native/**/*.cs"
      - "!win-hands-native/**/*.csproj"
      - "!win-hands-native/bin/**/!(win-hands.exe)"
      - "!linux-hands-native/target/**"
      - "!linux-hands-native/src/**"
      - "!linux-hands-native/Cargo.*"
  - from: voice-server
    to: voice-server
  - from: browser-bridge
    to: browser-bridge
linux:
  target:
    - AppImage
    - deb
  icon: assets/icon.png
  category: Utility
  maintainer: Astra Navi Contributors <maintainers@astranavi.app>
  desktop:
    entry:
      Name: Astra Navi Desktop
      Comment: Local-first AI desktop companion with 3D MMD avatar.
      StartupWMClass: astra-navi-desktop
win:
  target:
    - nsis
    - portable
  icon: assets/icon.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
