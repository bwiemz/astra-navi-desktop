<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'"
    />
    <title>Astra Navi — Visual Policy &amp; Standing-Order Composer</title>
  </head>
  <body>
    <header class="st-header">
      <div>
        <h1>Visual Policy &amp; Standing-Order Composer</h1>
        <p id="policy-subtitle" class="st-subtitle">Loading security posture…</p>
      </div>
      <div class="st-actions">
        <span id="policy-status" class="st-status" role="status" aria-live="polite">Ready</span>
        <button id="policy-refresh" type="button" class="btn-primary">Re-Run Audit</button>
      </div>
    </header>

    <main class="policy-grid">
      <section id="composer-panel" class="card"></section>
      <section id="orders-panel" class="card"></section>
      <section id="audit-panel" class="card"></section>
      <section id="experimental-panel" class="card full-span"></section>
    </main>

    <script type="module" src="./src/policy-composer/main.ts"></script>
  </body>
</html>
