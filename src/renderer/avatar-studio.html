<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'"
    />
    <title>Astra Navi — Avatar &amp; Stage Studio</title>
  </head>
  <body>
    <header class="st-header">
      <div>
        <h1>Avatar &amp; Stage Studio</h1>
        <p id="studio-subtitle" class="st-subtitle">Loading stage state…</p>
      </div>
      <div class="st-actions">
        <span id="studio-status" class="st-status" role="status" aria-live="polite">Ready</span>
        <button id="studio-save" type="button" class="btn-primary">Save Stage Settings</button>
      </div>
    </header>

    <main class="studio-grid">
      <section class="card preview-card">
        <div class="card-head">
          <h2>Live Embodied Stage Preview (Ambient Lighting + Props)</h2>
          <div class="btn-row">
            <button type="button" data-gesture="wave">Wave</button>
            <button type="button" data-gesture="nod">Nod</button>
            <button type="button" data-gesture="shrug">Shrug</button>
          </div>
        </div>
        <canvas id="studio-canvas" width="520" height="420"></canvas>
        <div id="prop-readout" class="mono-readout"></div>
      </section>

      <section class="card controls-card">
        <h2>Stage Lighting, Framing &amp; Performance</h2>
        <div id="studio-controls" class="controls-body"></div>
      </section>
    </main>

    <script type="module" src="./src/avatar-studio/main.ts"></script>
  </body>
</html>
